name: Build with PNPM

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v4.2.3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies for translation-and-context
        working-directory: ui/extensions/translation-and-context
        run: pnpm install

      - name: Build translation-and-context
        working-directory: ui/extensions/translation-and-context
        run: pnpm build

      - name: Run tests for translation-and-context
        working-directory: ui/extensions/translation-and-context
        run: pnpm test

      - name: Install dependencies for detection-context-explorer
        working-directory: ui/pages/detection-context-explorer
        run: pnpm install

      - name: Build detection-context-explorer
        working-directory: ui/pages/detection-context-explorer
        run: pnpm build

      - name: Run tests for detection-context-explorer
        working-directory: ui/pages/detection-context-explorer
        run: pnpm test

  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      - name: Run Validation
        id: trufflehog
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///workspace/ --branch HEAD \
            --config=.github/custom_detectors.yaml --no-verification \
            --exclude-paths=.github/detector-exclude-paths.txt \
            --results=verified,unknown,unverified --json --no-update --fail \
            > trufflehog-results.json 2>/dev/null
        continue-on-error: true
      - name: Validation summary
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Detector | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          jq -r 'select(.SourceMetadata) | "\(if .DetectorName == "CustomRegex" then (.ExtraData.name // "CustomRegex") else .DetectorName end) | \(.SourceMetadata.Data.Git.file) | L\(.SourceMetadata.Data.Git.line) | \(.SourceMetadata.Data.Git.commit)"' trufflehog-results.json | sort -u | awk '{printf "| %d | %s |\n", NR, $0}' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validation findings - failing build." >> $GITHUB_STEP_SUMMARY
      - name: Fail on validation findings
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
